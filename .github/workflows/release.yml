name: Publish v1.0.0
on:
  push:
    branches: [main]
    paths: [RELEASE_NOTES.md, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test game
        run: python -m pytest -q
      - name: Test effects
        run: node --test tests/test_battle_effects.cjs
      - name: Publish verified archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git archive --format=zip --prefix=DEADLOCK-v1.0.0/ --output=DEADLOCK-v1.0.0.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          gh release create v1.0.0 DEADLOCK-v1.0.0.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DEADLOCK v1.0.0' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
